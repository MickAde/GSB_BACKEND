        role:
          allOf:
          - $ref: '#/components/schemas/UserRoleEnum'
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
