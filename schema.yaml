openapi: 3.0.3
info:
  title: Genius Study Buddy API
  version: 1.0.0
  description: Multi-tenant AI-powered educational platform API. All school-scoped
    endpoints require a Bearer JWT token. The JWT payload embeds `school_id` and `role`
    which drive row-level security at the database kernel.
  contact:
    name: GSB Engineering
    email: mickade35@gmail.com
  license:
    name: Proprietary
paths:
  /api/v1/admin/culture/:
    get:
      operationId: admin_culture_retrieve
      description: |-
        GET /api/v1/admin/culture/  — Return the school's culture profile.
        PUT /api/v1/admin/culture/  — Create or fully update the culture profile (upsert).

        **Permission:** MAIN_ADMIN or SUB_ADMIN.
        School is inferred from the requesting admin's JWT.

        GET returns an empty-field culture object if none has been set up yet,
        so the frontend can always render the edit form.
      summary: Get school culture profile
      tags:
      - Admin — Culture
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolCulture'
          description: ''
    put:
      operationId: admin_culture_update
      description: |-
        GET /api/v1/admin/culture/  — Return the school's culture profile.
        PUT /api/v1/admin/culture/  — Create or fully update the culture profile (upsert).

        **Permission:** MAIN_ADMIN or SUB_ADMIN.
        School is inferred from the requesting admin's JWT.

        GET returns an empty-field culture object if none has been set up yet,
        so the frontend can always render the edit form.
      summary: Upsert school culture profile
      tags:
      - Admin — Culture
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolCultureWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SchoolCultureWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SchoolCultureWriteRequest'
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolCulture'
          description: ''
        '400':
          description: Validation error
  /api/v1/admin/daily-content/:
    get:
      operationId: admin_daily_content_list
      description: |-
        GET  /api/v1/admin/daily-content/  — List daily content for this school.
        POST /api/v1/admin/daily-content/  — Create a new daily content entry.

        **Permission:** MAIN_ADMIN or SUB_ADMIN.
        The `school` is automatically set to the requesting admin's school.

        `unique_together (school, content_type, display_date)` means only one entry per
        type per day. A duplicate POST returns 409 Conflict.
      summary: List school daily content
      parameters:
      - in: query
        name: content_type
        schema:
          type: string
        description: Filter by STUDENT_QUOTE / TEACHER_TIP / ADMIN_INSIGHT
      - in: query
        name: display_date
        schema:
          type: string
        description: Filter by date (YYYY-MM-DD)
      tags:
      - Admin — Daily Content
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DailyContent'
          description: ''
    post:
      operationId: admin_daily_content_create
      description: |-
        GET  /api/v1/admin/daily-content/  — List daily content for this school.
        POST /api/v1/admin/daily-content/  — Create a new daily content entry.

        **Permission:** MAIN_ADMIN or SUB_ADMIN.
        The `school` is automatically set to the requesting admin's school.

        `unique_together (school, content_type, display_date)` means only one entry per
        type per day. A duplicate POST returns 409 Conflict.
      summary: Create daily content entry
      tags:
      - Admin — Daily Content
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyContentWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DailyContentWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DailyContentWriteRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyContent'
          description: ''
        '400':
          description: Validation error
        '409':
          description: Entry already exists for this type and date
  /api/v1/admin/daily-content/{id}/:
    patch:
      operationId: admin_daily_content_partial_update
      description: |-
        PATCH  /api/v1/admin/daily-content/{id}/  — Update body or author of an entry.
        DELETE /api/v1/admin/daily-content/{id}/  — Delete a daily content entry.

        **Permission:** MAIN_ADMIN or SUB_ADMIN, same school only.

        > Only `body` and `author` are updatable via PATCH.
        > `content_type` and `display_date` are identity fields — create a new entry if you need
        > a different type or date.
      summary: Update daily content (body / author only)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin — Daily Content
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDailyContentUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDailyContentUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDailyContentUpdateRequest'
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyContent'
          description: ''
        '400':
          description: Validation error
        '404':
          description: Not found
    delete:
      operationId: admin_daily_content_destroy
      description: |-
        PATCH  /api/v1/admin/daily-content/{id}/  — Update body or author of an entry.
        DELETE /api/v1/admin/daily-content/{id}/  — Delete a daily content entry.

        **Permission:** MAIN_ADMIN or SUB_ADMIN, same school only.

        > Only `body` and `author` are updatable via PATCH.
        > `content_type` and `display_date` are identity fields — create a new entry if you need
        > a different type or date.
      summary: Delete daily content
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin — Daily Content
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
  /api/v1/admin/school/:
    get:
      operationId: admin_school_retrieve
      description: |-
        GET   /api/v1/admin/school/  — Return the admin's own school info.
        PATCH /api/v1/admin/school/  — Update the school's public info (name, logo, address, contacts).

        **Permission:** MAIN_ADMIN or SUB_ADMIN.
        School is inferred from the requesting admin's JWT.

        > `slug` and `is_active` can only be changed by a platform owner
        > via `PATCH /api/v1/platform/schools/{id}/`.
      summary: Get own school info
      tags:
      - Admin — School
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolAdmin'
          description: ''
    patch:
      operationId: admin_school_partial_update
      description: |-
        GET   /api/v1/admin/school/  — Return the admin's own school info.
        PATCH /api/v1/admin/school/  — Update the school's public info (name, logo, address, contacts).

        **Permission:** MAIN_ADMIN or SUB_ADMIN.
        School is inferred from the requesting admin's JWT.

        > `slug` and `is_active` can only be changed by a platform owner
        > via `PATCH /api/v1/platform/schools/{id}/`.
      summary: Update own school info (name, logo, address, contacts)
      tags:
      - Admin — School
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSchoolAdminSelfUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSchoolAdminSelfUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSchoolAdminSelfUpdateRequest'
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolAdmin'
          description: ''
        '400':
          description: Validation error
  /api/v1/admin/users/:
    get:
      operationId: admin_users_list
      description: |-
        GET  /api/v1/admin/users/  — List users in the admin's school (paginated, filterable).
        POST /api/v1/admin/users/  — Create a new user inside the school.

        **Permission:** MAIN_ADMIN or SUB_ADMIN.
        The `school` is automatically set to the requesting admin's school.

        **Creatable roles via POST:** STUDENT, TEACHER, SUB_ADMIN.
        *(MAIN_ADMIN and VISITOR cannot be created via this endpoint.)*

        > Only MAIN_ADMIN can create SUB_ADMIN accounts.

        **GET query params:**
        - `role` — filter by role (STUDENT, TEACHER, SUB_ADMIN, MAIN_ADMIN)
        - `is_active` — filter by status (true / false)
        - `search` — search first name, last name, email, or admission number
      summary: List school users
      parameters:
      - in: query
        name: is_active
        schema:
          type: string
        description: Filter by is_active (true/false)
      - in: query
        name: role
        schema:
          type: string
        description: Filter by role
      - in: query
        name: search
        schema:
          type: string
        description: Search name, email, or admission number
      tags:
      - Admin — Users
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserAdminList'
          description: ''
    post:
      operationId: admin_users_create
      description: |-
        GET  /api/v1/admin/users/  — List users in the admin's school (paginated, filterable).
        POST /api/v1/admin/users/  — Create a new user inside the school.

        **Permission:** MAIN_ADMIN or SUB_ADMIN.
        The `school` is automatically set to the requesting admin's school.

        **Creatable roles via POST:** STUDENT, TEACHER, SUB_ADMIN.
        *(MAIN_ADMIN and VISITOR cannot be created via this endpoint.)*

        > Only MAIN_ADMIN can create SUB_ADMIN accounts.

        **GET query params:**
        - `role` — filter by role (STUDENT, TEACHER, SUB_ADMIN, MAIN_ADMIN)
        - `is_active` — filter by status (true / false)
        - `search` — search first name, last name, email, or admission number
      summary: Create a user in the school
      tags:
      - Admin — Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdminDetail'
          description: ''
        '400':
          description: Validation error
        '403':
          description: Only MAIN_ADMIN can create SUB_ADMIN accounts
  /api/v1/admin/users/{id}/:
    get:
      operationId: admin_users_retrieve
      description: |-
        GET    /api/v1/admin/users/{id}/  — Full user detail.
        PATCH  /api/v1/admin/users/{id}/  — Update first_name, last_name, is_active.
        DELETE /api/v1/admin/users/{id}/  — Soft-deactivate (sets is_active=False).

        **Permission:** MAIN_ADMIN or SUB_ADMIN, same school only.
      summary: Get user detail
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin — Users
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdminDetail'
          description: ''
        '404':
          description: Not found
    patch:
      operationId: admin_users_partial_update
      description: |-
        GET    /api/v1/admin/users/{id}/  — Full user detail.
        PATCH  /api/v1/admin/users/{id}/  — Update first_name, last_name, is_active.
        DELETE /api/v1/admin/users/{id}/  — Soft-deactivate (sets is_active=False).

        **Permission:** MAIN_ADMIN or SUB_ADMIN, same school only.
      summary: Update user (name / active status)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin — Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserAdminUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserAdminUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserAdminUpdateRequest'
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdminDetail'
          description: ''
        '400':
          description: Validation error
        '404':
          description: Not found
    delete:
      operationId: admin_users_destroy
      description: |-
        GET    /api/v1/admin/users/{id}/  — Full user detail.
        PATCH  /api/v1/admin/users/{id}/  — Update first_name, last_name, is_active.
        DELETE /api/v1/admin/users/{id}/  — Soft-deactivate (sets is_active=False).

        **Permission:** MAIN_ADMIN or SUB_ADMIN, same school only.
      summary: Deactivate user (soft-delete)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin — Users
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '204':
          description: User deactivated
        '404':
          description: Not found
  /api/v1/admin/users/{id}/set-password/:
    post:
      operationId: admin_users_set_password_create
      description: |-
        POST /api/v1/admin/users/{id}/set-password/

        Admin sets a user's password directly — no old-password check required.
        Useful for resetting a student's forgotten password.

        **Permission:** MAIN_ADMIN or SUB_ADMIN, same school only.
        > Sub-admin cannot reset another admin's password.
      summary: 'Admin: set user password'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin — Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSetPasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminSetPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminSetPasswordRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '204':
          description: Password updated
        '400':
          description: Validation error
        '403':
          description: Permission denied
        '404':
          description: User not found
  /api/v1/admin/users/bulk/:
    post:
      operationId: admin_users_bulk_create
      description: |-
        POST /api/v1/admin/users/bulk/

        Bulk-create multiple STUDENT accounts in a single request.
        Returns a 207 Multi-Status response listing successes and failures so the
        frontend can show a per-row import report.

        **Permission:** MAIN_ADMIN or SUB_ADMIN.
      summary: Bulk-create students
      tags:
      - Admin — Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkStudentCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BulkStudentCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BulkStudentCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkStudentCreateResponse'
          description: ''
        '207':
          description: Partial success — check `failed` list
        '400':
          description: Validation error
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        POST /api/v1/auth/login/

        Dual-vector authentication:
        - **STUDENT** → identifies via `username` (admission number), no email required
        - **TEACHER / *_ADMIN / VISITOR** → identifies via `email`

        On success, returns an access token (15 min) and a refresh token (7 days).
        Both tokens embed `role` and `school_id` in their payload.
      summary: Login (all roles)
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              StudentLogin:
                value:
                  role: STUDENT
                  identifier: ADM1029
                  password: secret
                  school_id: 99999999-1111-2222-3333-444444444444
                summary: Student login
              TeacherLogin:
                value:
                  role: TEACHER
                  identifier: teacher@school.com
                  password: secret
                  school_id: 99999999-1111-2222-3333-444444444444
                summary: Teacher login
              VisitorLogin:
                value:
                  role: VISITOR
                  identifier: visitor@email.com
                  password: secret
                summary: Visitor login
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
        '401':
          description: Invalid credentials
        '403':
          description: Account disabled or role mismatch
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        POST /api/v1/auth/logout/

        Blacklists the refresh token — the access token will naturally expire
        within 15 minutes (its configured lifetime).
      summary: Logout (blacklist refresh token)
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '204':
          description: Logged out successfully
        '400':
          description: Missing or invalid refresh token
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: |-
        GET  /api/v1/auth/me/  — Return the authenticated user's own profile.
        PATCH /api/v1/auth/me/ — Update first_name / last_name.
      summary: Get own profile
      tags:
      - Auth
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    patch:
      operationId: auth_me_partial_update
      description: |-
        GET  /api/v1/auth/me/  — Return the authenticated user's own profile.
        PATCH /api/v1/auth/me/ — Update first_name / last_name.
      summary: Update own profile (first/last name)
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '400':
          description: Validation error
  /api/v1/auth/password/change/:
    post:
      operationId: auth_password_change_create
      description: |-
        POST /api/v1/auth/password/change/

        Authenticated user changes their own password.
        Requires the current password for verification.
      summary: Change own password
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '204':
          description: Password changed
        '400':
          description: Validation error or wrong old password
  /api/v1/auth/password/reset/:
    post:
      operationId: auth_password_reset_create
      description: |-
        POST /api/v1/auth/password/reset/

        Request a password-reset email. Always returns 200 regardless of whether the
        email is registered — prevents user enumeration.
      summary: Request password reset email
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetRequestResponse'
          description: ''
  /api/v1/auth/password/reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: |-
        POST /api/v1/auth/password/reset/confirm/

        Confirm a password reset using the `uid` + `token` from the reset email.
        The token is single-use — it becomes invalid once the password is changed.
      summary: Confirm password reset
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '204':
          description: Password reset successfully
        '400':
          description: Invalid or expired reset link
  /api/v1/auth/register/visitor/:
    post:
      operationId: auth_register_visitor_create
      description: |-
        POST /api/v1/auth/register/visitor/

        Creates a Visitor account with a **1-week free trial**.
        Sends an email verification link — the visitor must verify before logging in.
      summary: Register as Visitor
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitorRegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VisitorRegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VisitorRegistrationRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterVisitorResponse'
          description: ''
        '400':
          description: Validation error
  /api/v1/auth/resend-verification/:
    post:
      operationId: auth_resend_verification_create
      description: |-
        POST /api/v1/auth/resend-verification/

        Re-send the email verification link for a Visitor account.
        Always returns 200 to prevent email enumeration.
